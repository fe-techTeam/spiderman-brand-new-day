name: Deploy to production (self-hosted)

# Runs on the production server's own GitHub Actions runner. On every push to
# main (e.g. merging dev -> main) it checks out the code, builds the standalone
# Next.js bundle, syncs it into DEPLOY_DIR, and restarts the PM2 app.
#
# Runner prerequisites (one-time, on the server):
#   - Node.js + npm on PATH, pm2 installed globally, rsync available
#   - The runner user can write to DEPLOY_DIR and run pm2
#   - Production .env lives at $DEPLOY_DIR/.env (gitignored — never in the repo).
#     It is copied into the workspace pre-build: `prebuild` (scripts/migrate.js)
#     reads DB creds from it, and `next build` traces it into .next/standalone/,
#     which is where the runtime reads it (server.js chdirs into standalone).
#
# Replaces the previous ECS/ECR pipeline (see git history for deploy.yml@fd30751
# and earlier if you ever need it back).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Never let two deploys overlap on the same box.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Production folder PM2 serves from — adjust to your server's path.
  DEPLOY_DIR: /var/www/html/spiderman-brand-new-day
  PM2_APP: spider-mania

jobs:
  deploy:
    name: Build and deploy
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The workspace is a fresh checkout with no .env (gitignored). Pull the
      # production one in before installing/building — migrate.js and the
      # standalone trace both depend on it.
      - name: Copy production env file into workspace
        run: |
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "::error::$DEPLOY_DIR/.env not found — create it on the server first."
            exit 1
          fi
          cp "$DEPLOY_DIR/.env" .env

      - name: Install dependencies
        run: npm ci

      # prebuild applies migrations/*.sql against the DB from .env, then
      # next build produces the self-contained .next/standalone bundle
      # (postbuild copies .next/static and public/ into it).
      # DEPLOYMENT_ID bakes ?dpl=<short-sha> into asset URLs for version-skew
      # protection behind CloudFront (next.config.mjs deploymentId).
      - name: Build (migrations run via prebuild)
        run: DEPLOYMENT_ID="${GITHUB_SHA::7}" npm run build

      # Mirror the workspace into the production folder.
      #   --delete keeps it a faithful mirror (no stale files), but excluded
      #   paths are protected: the server's own .env, uploads/ (local-driver
      #   media), and PM2/OS cruft survive every deploy.
      #   /.env is anchored to the root so .next/standalone/.env still syncs.
      - name: Deploy to production folder
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete \
            --exclude '/.env' \
            --exclude '/.env.local' \
            --exclude '/uploads/' \
            --exclude '/node_modules/' \
            --exclude '/.next/cache/' \
            --exclude '/.git/' \
            "$GITHUB_WORKSPACE"/ "$DEPLOY_DIR"/

      # Plain restart is enough: the process re-reads .next/standalone/.env on
      # boot. First deploy (app not registered yet) falls back to pm2 start.
      - name: Restart app
        run: |
          pm2 restart "$PM2_APP" || pm2 start "$DEPLOY_DIR/ecosystem.config.js"
          pm2 save
