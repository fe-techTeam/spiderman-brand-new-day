<?xml version="1.0" encoding="UTF-8"?>
<!-- Walkthrough "Media" icon — flat #E50101 glyph with transparent cutouts,
     same language as the other walk-card icons: a carousel card with a
     play-triangle cutout, neighbour cards peeking at the edges. Cutouts stay
     transparent under the shared hover filter (brightness(0) invert(1)) which
     turns the glyph into a white silhouette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="#E50101" transform="rotate(-12 100 100)">
    <!-- neighbour cards peeking into frame -->
    <rect x="8" y="72" width="16" height="56" rx="6"/>
    <rect x="176" y="72" width="16" height="56" rx="6"/>
    <!-- main card with play-triangle cutout -->
    <path fill-rule="evenodd"
      d="M48 48h104a12 12 0 0 1 12 12v80a12 12 0 0 1-12 12H48a12 12 0 0 1-12-12V60a12 12 0 0 1 12-12Zm38 30 48 22-48 22V78Z"/>
  </g>
</svg>
